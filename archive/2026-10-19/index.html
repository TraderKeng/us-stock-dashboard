.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}

header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px}

h3{font-size:14px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}h3 i{width:4px;height:16px;border-radius:2px;display:inline-block}

.heat .top{color:#fff;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sc{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gc);border-radius:10px;padding:12px 14px;cursor:pointer;transition:background .15s;text-align:left;color:inherit;font-family:inherit;width:100%}
.sc:hover,.sc:focus-visible{background:#15203a;outline:none}.sc.sel{background:#1a2a4d;border-color:var(--acc);border-left-color:var(--gc)}
.sc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sc .nm{font-size:13px;font-weight:600}.sc .code{color:var(--mute);font-size:11px;font-family:ui-monospace,Menlo,monospace}
.sc .row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:6px}
.sc .num{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.sc .num.zero{color:var(--mute)}
.sc .pct{color:var(--mute);font-size:12px}.dl{font-size:12px;font-weight:600}.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--mute);font-weight:400}
.sc .cond{color:var(--mute);font-size:12px;line-height:1.5;margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sc .cond.open{display:block}.more{background:none;border:0;color:var(--acc);font-size:11px;cursor:pointer;padding:2px 0;font-family:inherit}
.apx{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:8px;background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.35);white-space:nowrap;cursor:help}
.tag2{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:8px;background:rgba(56,189,248,.1);color:#7dd3fc;border:1px solid rgba(56,189,248,.35);white-space:nowrap}
#detail{margin-top:18px;scroll-margin-top:60px}
.dgrid{display:grid;grid-template-columns:minmax(260px,1fr) 2.4fr;gap:14px}
.tw{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}td.num,th.num{text-align:right}
thead th{position:sticky;top:0;z-index:1;background:var(--card2);color:var(--mute);font-weight:600;cursor:pointer;user-select:none}
thead th:hover,thead th:focus{color:var(--ink);outline:none;background:#16223b}thead th:focus-visible{box-shadow:inset 0 0 0 2px var(--acc)}
thead th .ar{display:inline-block;width:12px;font-size:10px;margin-left:3px;opacity:.35}thead th[aria-sort] .ar{opacity:1;color:var(--acc)}
tbody tr:hover{background:#15203a}.sym{font-weight:700}.co{color:var(--mute);max-width:220px;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--up)}.neg{color:var(--dn)}.p2{background:rgba(34,197,94,.12)}.n2{background:rgba(239,68,68,.12)}
.bd{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:9px;margin-right:3px}
.bd.DJIA{background:rgba(196,181,253,.12);color:#c4b5fd;border:1px solid rgba(196,181,253,.35)}.bd.NDX{background:rgba(103,232,249,.1);color:#67e8f9;border:1px solid rgba(103,232,249,.35)}.bd.SPX{background:rgba(251,146,190,.1);color:#f9a8d4;border:1px solid rgba(251,146,190,.35)}
.empty{color:var(--mute);text-align:center;padding:28px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
input,select{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit}input{min-width:200px}
.chip{background:var(--card2);color:var(--mute);border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rc{color:var(--mute);font-size:13px;margin-left:auto}
svg text{fill:var(--mute);font-size:11px}.bar-row{cursor:pointer}.bar-row:hover rect.bg{fill:#16223b}
.note{color:var(--mute);font-size:12px;line-height:1.6;margin-top:8px}
footer{color:var(--mute);font-size:12px;margin-top:22px;line-height:1.8;border-top:1px solid var(--line);padding-top:12px}
#v2f{width:100%;border:0;display:block;min-height:1200px}
.hidden{display:none!important}
.secbox summary{color:var(--mute);font-size:13px;margin-bottom:6px;cursor:pointer;list-style:none}.secbox summary::-webkit-details-marker{display:none}

}

 input{min-width:0;flex:1 1 100%}.rc{margin-left:0}h1{font-size:18px}}

/* sortable table */
function makeTable(host,cols,getRows,opt){
 const st={key:opt.key,dir:opt.dir||'desc'};
 function render(){
  const c=cols.find(c=>c.k===st.key)||cols[0],num=c.t==='n',m=st.dir==='asc'?1:-1,val=r=>c.v?c.v(r):r[c.k];
  const s=getRows().slice().sort((a,b)=>{const x=val(a),y=val(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;
   return (num?(x-y):String(x).localeCompare(String(y),'zh-Hant'))*m;});
  const th=cols.map(c=>{const on=c.k===st.key;return `<th class="${c.t==='n'?'num':''} ${c.cls||''}" tabindex="0" data-k="${c.k}" ${on?`aria-sort="${st.dir==='asc'?'ascending':'descending'}"`:''} title="撳一下排序">${c.h}<span class="ar">${on?(st.dir==='asc'?'▲':'▼'):'↕'}</span></th>`;}).join('');
  const body=s.length?s.map(r=>'<tr>'+cols.map(c=>c.r(r)).join('')+'</tr>').join(''):`<tr><td colspan="${cols.length}" class="empty">${opt.empty()}</td></tr>`;
  host.innerHTML=`<table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>`;
  host.querySelectorAll('th').forEach(t=>{const go=()=>{const k=t.dataset.k;
   if(st.key===k)st.dir=st.dir==='asc'?'desc':'asc';else{st.key=k;st.dir=cols.find(c=>c.k===k).t==='n'?'desc':'asc';}
   render();const n=host.querySelector(`th[data-k="${k}"]`);n&&n.focus();};
   t.addEventListener('click',go);t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});
  opt.after&&opt.after(s.length);}
 return {render,st};}

 if(code==='IPO_BASE')c.push(C.fb);return c;}

let fq='',fs='',fi='all',rows=[],tbl=null,curDef=null;
if(!D.has_mem)$('ixChips').style.display='none';
function filtered(){return rows.filter(s=>(!fs||s.sector===fs)&&(fi==='all'||(fi==='none'?!s.idx.length:s.idx.includes(fi)))&&(!fq||(s.symbol+' '+(s.description||'')).toLowerCase().includes(fq)));}
function secChart(){
 const a=D.secs.filter(s=>s.code===curDef.code&&s.count>0).sort((x,y)=>y.count-x.count||x.sector.localeCompare(y.sector));
 const host=$('dSec');if(!a.length){host.innerHTML='<div class="empty">今日冇股票符合</div>';return;}
 const W=Math.max(280,Math.min(520,host.clientWidth||400)),rh=22,lw=W<360?118:150,bw=W-lw-34,mx=Math.max(...a.map(s=>s.count)),col=getComputedStyle(document.documentElement).getPropertyValue(grpOf(curDef)[2]);
 host.innerHTML=`<svg viewBox="0 0 ${W} ${a.length*rh}" width="100%" style="max-width:${W}px">${a.map((s,i)=>{const y=i*rh,sel=s.sector===fs,w=Math.max(2,bw*s.count/mx);
  return `<g class="bar-row" data-sec="${esc(s.sector)}" tabindex="0" role="button"><rect class="bg" x="0" y="${y}" width="${W}" height="${rh}" fill="${sel?'#1a2a4d':'transparent'}"/><text x="${lw-6}" y="${y+15}" text-anchor="end" style="${sel?'fill:#e2e8f0':''}">${esc(s.sector)}</text><rect x="${lw}" y="${y+5}" width="${w}" height="12" rx="2" fill="${col}" opacity="${fs&&!sel?.4:1}"/><text x="${lw+w+5}" y="${y+15}" style="fill:#e2e8f0">${s.count}</text><title>${esc(s.sector)}：${s.count} 隻</title></g>`;}).join('')}</svg>`;
 host.querySelectorAll('.bar-row').forEach(n=>{const go=()=>{fs=fs===n.dataset.sec?'':n.dataset.sec;$('secSel').value=fs;secChart();tbl.render();};n.addEventListener('click',go);n.addEventListener('keydown',e=>{if(e.key==='Enter')go();});});}
function openScreen(code,scroll=true){
 curDef=D.defs.find(d=>d.code===code);if(!curDef)return;selCode=code;
 document.querySelectorAll('.sc').forEach(e=>e.classList.toggle('sel',e.dataset.code===code));
 rows=(D.hits[code]||[]).map(s=>D.U[s]).filter(Boolean);fq='';fs='';fi='all';$('q').value='';
 document.querySelectorAll('.ixc').forEach(x=>x.classList.toggle('on',x.dataset.i==='all'));
 const sel=$('secSel');sel.innerHTML='<option value="">全部板塊</option>'+[...new Set(rows.map(r=>r.sector).filter(Boolean))].sort().map(s=>`<option>${esc(s)}</option>`).join('');
 const h=cur(code);
 $('dTitle').innerHTML=`<span style="width:4px;height:16px;border-radius:2px;background:var(${grpOf(curDef)[2]});display:inline-block"></span>${esc(nameOf(curDef))} <span class="cnt">${esc(code)}｜${h?h.count:0} 隻${pctU(h)!=null?'（佔股票池 '+pctU(h).toFixed(1)+'%）':''}</span>${isApx(curDef)?`<span class="apx">≈ 近似</span>`:''}`;
 $('dCond').innerHTML='條件：'+esc(curDef.description)+(isApx(curDef)?`　<span style="color:#fbbf24">≈ ${esc(curDef.accuracy)}</span>`:'')+(code==='IPO_BASE'?'　<span style="color:#7dd3fc">註：包括分拆上市（spin-off）。</span>':'')+(/^BULL_S2/.test(code)?'　<span style="color:#7dd3fc">註：市值 ≥20 億美元版本，同「Stage 2 追蹤（市值 ≥200億美元）」分頁唔同。</span>':'');
 $('detail').classList.remove('hidden');
 tbl=makeTable($('dTbl'),colsFor(code),filtered,{key:/^EARN/.test(code)?'gap_pct':'market_cap',empty:()=>rows.length?'冇符合篩選嘅股票':'今日冇股票符合',
  after:n=>{$('rc').textContent=`顯示 ${n} / ${rows.length} 隻`+(fs?`｜板塊：${fs}`:'');}});
 tbl.render();secChart();
 if(scroll&&innerWidth<1400)$('detail').scrollIntoView({behavior:'smooth',block:'start'});}
let _qt;$('q').addEventListener('input',e=>{clearTimeout(_qt);_qt=setTimeout(()=>{fq=e.target.value.trim().toLowerCase();tbl&&tbl.render();},80);});
$('secSel').addEventListener('change',e=>{fs=e.target.value;secChart();tbl.render();});
document.querySelectorAll('.ixc').forEach(b=>b.addEventListener('click',()=>{fi=b.dataset.i;document.querySelectorAll('.ixc').forEach(x=>x.classList.toggle('on',x===b));tbl&&tbl.render();}));
let _rw;addEventListener('resize',()=>{clearTimeout(_rw);_rw=setTimeout(()=>curDef&&secChart(),150);});

/* footer */
(function(){const apx=D.defs.filter(isApx);
 $('foot').innerHTML=`資料來源：us_stage2_breadth.db（Screener Count Tracker；TradingView 篩選數據），只讀。數據日期 ${esc(D.date)}（美東交易日），每日約 07:30（香港時間）新增一日。<br>
 通用濾網：市值 &gt; 20 億美元、股價 &gt; $15、20 日平均成交額 &gt; 5,000 萬美元、只計普通股。股票池 ${D.universe==null?'—':D.universe} 隻。<br>
 <b>兩個 Stage 2 定義唔同：</b>「牛市 Stage 2（BULL_S2）」用通用濾網（市值 ≥20 億美元）；「Stage 2 追蹤（市值 ≥200億美元）」分頁係 Ken 自己追蹤嘅大型股版本（市值 &gt; 200 億美元，另有成交額條件），兩者數字唔可以直接比較。<br>
 ≈ 近似篩選：${apx.map(d=>`${esc(d.code)}（${esc(d.accuracy)}）`).join('；')||'冇'}。IPO Base 以 TradingView 首根 K 線日期計，包括分拆上市。<br>
 指數成份：${D.has_mem?D.mem_meta.map(m=>`${IXN[m.index_code]||esc(m.index_code)} 截至 ${esc(m.as_of)}（${esc(m.source)}）`).join('；'):'指數成份資料未有'}。
 ${D.missing.length?`<br>⚠ ${D.missing.length} 隻命中股票喺 universe_daily 搵唔到資料，未有列出：${D.missing.map(esc).join(', ')}`:''}<br>僅供研究參考，不構成投資建議。`;})();

if(innerWidth>=1400&&innerHeight<1000)document.querySelector('.secbox').open=false;
(function(){let b=null;D.defs.forEach(d=>{const h=cur(d.code);if(h&&(!b||h.count>b.count))b=h;});if(b)openScreen(b.code,false);})();
if(location.hash==='#stage2')showTab('s2');
</script></body></html>
